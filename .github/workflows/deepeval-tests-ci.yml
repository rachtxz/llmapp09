name: DeepEval Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'deepeval-tests/**'
      - 'llm-multiroute/**'
      - '.github/workflows/deepeval-tests-ci.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'deepeval-tests/**'
      - 'llm-multiroute/**'
      - '.github/workflows/deepeval-tests-ci.yml'
  workflow_dispatch:

env:
  # Backend (passed to docker compose; docker-compose.yml must forward these)
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  # DeepEval judge: local Ollama on the runner
  LOCAL_MODEL_NAME: qwen2.5:7b
  LOCAL_MODEL_BASE_URL: http://localhost:11434/v1
  LOCAL_MODEL_API_KEY: ollama
  USE_LOCAL_MODEL: "YES"
  DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

jobs:
  deepeval:
    name: DeepEval LLM Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: deepeval-tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deepeval-tests/requirements.txt
          pip install ollama

      - name: Build and start backend
        run: docker compose up -d llm-multiroute

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer may already start a service; only start manually if needed
          if ! curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
            nohup ollama serve > ollama.log 2>&1 &
          fi
          echo "Waiting for Ollama to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "Ollama is ready."
              break
            fi
            sleep 2
          done

      - name: Pull Ollama judge model
        run: ollama pull ${{ env.LOCAL_MODEL_NAME }}

      - name: Configure DeepEval to use Ollama
        working-directory: deepeval-tests
        run: deepeval set-ollama --model=${{ env.LOCAL_MODEL_NAME }} --base-url="http://localhost:11434"

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/api/ai/routes > /dev/null 2>&1; then
              echo "Backend is ready."
              exit 0
            fi
            echo "Attempt $i/30 - backend not ready yet..."
            sleep 5
          done
          echo "Backend failed to start."
          docker compose logs llm-multiroute
          exit 1

      - name: Run DeepEval classify tests
        working-directory: deepeval-tests
        run: deepeval test run test_classify.py -v

      - name: Run DeepEval sentiment tests
        working-directory: deepeval-tests
        run: deepeval test run test_sentiment.py -v

      - name: Run DeepEval summarize tests
        working-directory: deepeval-tests
        run: deepeval test run test_summarize.py -v

      - name: Run DeepEval intent tests
        working-directory: deepeval-tests
        run: deepeval test run test_intent.py -v

      - name: Show Ollama log on failure
        if: failure()
        run: cat ollama.log || true

      - name: Tear down backend
        if: always()
        run: docker compose down